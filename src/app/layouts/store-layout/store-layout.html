<div class="flex min-h-screen flex-col">
  <!-- ===== Header ===== -->
  <header class="sticky top-0 z-40 border-b border-line bg-surface/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-6xl items-center gap-4 px-4">
      <a routerLink="/store" class="flex items-center gap-2.5">
        <span class="grid h-9 w-9 place-items-center rounded-lg bg-brand text-white">
          <app-icon name="store" [size]="18" />
        </span>
        <span class="text-base font-semibold text-ink">Shop Manager</span>
      </a>

      <nav class="ml-6 hidden items-center gap-1 sm:flex">
        <a
          routerLink="/store"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="text-brand"
          class="rounded-lg px-3 py-2 text-sm font-medium text-muted transition hover:text-ink"
        >
          Products
        </a>
        @if (auth.isCustomer()) {
          <a routerLink="/store/account" routerLinkActive="text-brand" class="rounded-lg px-3 py-2 text-sm font-medium text-muted transition hover:text-ink">
            My Orders
          </a>
        }
      </nav>

      <div class="ml-auto flex items-center gap-2">
        <!-- cart -->
        <a
          routerLink="/store/cart"
          class="relative grid h-10 w-10 place-items-center rounded-lg text-muted transition hover:bg-canvas hover:text-ink"
          aria-label="Cart"
        >
          <app-icon name="cart" [size]="20" />
          @if (cart.count() > 0) {
            <span class="absolute right-1 top-1 grid h-4 min-w-4 place-items-center rounded-full bg-brand px-1 text-[10px] font-bold text-white">
              {{ cart.count() }}
            </span>
          }
        </a>

        <!-- account -->
        @if (auth.isCustomer()) {
          <div class="relative">
            <button
              (click)="menuOpen.set(!menuOpen())"
              class="flex items-center gap-2 rounded-lg border border-line px-2.5 py-1.5 text-sm font-medium text-ink transition hover:border-slate-300"
            >
              <span class="grid h-6 w-6 place-items-center rounded-full bg-brand text-xs text-white">
                {{ auth.currentUser()?.name?.charAt(0) }}
              </span>
              <span class="hidden sm:inline">{{ auth.currentUser()?.name }}</span>
              <app-icon name="chevron-down" [size]="15" />
            </button>
            @if (menuOpen()) {
              <div class="absolute right-0 mt-2 w-44 overflow-hidden rounded-xl border border-line bg-surface shadow-[var(--shadow-pop)]">
                <a routerLink="/store/account" (click)="menuOpen.set(false)" class="block px-4 py-2.5 text-sm text-ink transition hover:bg-canvas">My Account</a>
                <button (click)="logout()" class="block w-full px-4 py-2.5 text-left text-sm text-red-600 transition hover:bg-canvas">Logout</button>
              </div>
            }
          </div>
        } @else {
          <a routerLink="/login" class="rounded-lg bg-brand px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-dark">
            Login
          </a>
        }
      </div>
    </div>
  </header>

  <!-- ===== Page ===== -->
  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6">
    <router-outlet />
  </main>

  <!-- ===== Footer ===== -->
  <footer class="border-t border-line bg-surface">
    <div class="mx-auto max-w-6xl px-4 py-6 text-sm text-muted">
      © 2026 Shop Manager — online orders, delivery aur udhaar.
    </div>
  </footer>
</div>
